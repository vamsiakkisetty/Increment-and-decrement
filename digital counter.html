<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .container{
        display:block;
        text-align:center;
        position:absolute;
        top:20%;
        left:50%;
        transform:translate(-50%,-50%);
        width:200px;
        height: 120px;
        border:1px solid rgb(164, 245, 207);
        border-radius: 10px;
        box-shadow:0 0 10px rgb(164, 245, 207)   ;
    }
    button{
        width: 50px;
        height: 50px;
        border-radius: 50%;
        border: none;
        background-color: rgb(164, 245, 207);
        box-shadow:0 0 10px rgb(164, 245, 207)   ;
    }
</style>
<body><div class="container">
        <h2 id='num'>0</h2>
        <button name="button" onclick="add()">➕</button>
        <button name="button" onclick="sub()">➖</button>
        <button type="button" onclick="reset()">🔂</button>
        </div>
    <script>
        var n=0;
        function add(){
            n++;
            document.getElementById('num').innerHTML=n;
        }
        function sub(){
            n--;
            document.getElementById('num').innerHTML=n;
        }
        function reset(){
            n=0;
            document.getElementById('num').innerHTML=n;
        }
        </script>
</body>
</html>
